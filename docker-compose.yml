services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-backend}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-backend}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    command: npm run start:dev
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-backend}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./clientApp
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      VITE_API_TARGET: http://backend:3001
      VITE_API_URL: /api
    volumes:
      - ./clientApp:/app
      - /app/node_modules
    ports:
      - "8080:8080"

volumes:
  pg18_data:
