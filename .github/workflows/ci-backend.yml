name: CI Backend

on:
  pull_request:
  push:
    branches:
      - preprod
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend
        run: docker build --target build -t rekr-backend:ci ./backend

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rekr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rekr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `DATABASE_URL` is what `prisma migrate deploy` reads; `TEST_DATABASE_URL`
      # is what the e2e suite runs against. The suite ignores the former on
      # purpose, so that an ambient application URL can never be truncated.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rekr_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rekr_test
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test:cov

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: warn

  gate:
    name: Backend CI
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    if: always()

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "build / lint / test : $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*)
              echo "::error::Le pipeline backend a echoue, la PR ne peut pas etre mergee."
              exit 1
              ;;
          esac
