name: CI Frontend

on:
  pull_request:
    paths:
      - 'clientApp/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches:
      - preprod
      - main
    paths:
      - 'clientApp/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
