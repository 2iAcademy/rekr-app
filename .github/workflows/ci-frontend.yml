name: CI Frontend

on:
  pull_request:
    paths:
      - 'clientApp/**'
      - '.github/workflows/ci-frontend.yml'
  push:
    branches:
      - preprod
      - main
    paths:
      - 'clientApp/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clientApp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Build
        run: npm run build
