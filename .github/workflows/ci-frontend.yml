name: CI Frontend

on:
  pull_request:
  push:
    branches:
      - preprod
      - main
    paths:
      - 'clientApp/**'
      - '.github/workflows/ci-frontend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both workflows run on every pull request because their gate is a required
  # check: a path filter on the trigger would leave it pending forever.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}

    steps:
      - name: Detect frontend changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'clientApp/**'
              - '.github/workflows/ci-frontend.yml'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: clientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: clientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Format
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: clientApp
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clientApp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:cov

  gate:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: [changes, build, lint, test]
    if: always()

    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes / build / lint / test : $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*)
              echo "::error::Le pipeline frontend a echoue, la PR ne peut pas etre mergee."
              exit 1
              ;;
          esac
