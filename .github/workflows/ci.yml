name: CI

on:
  pull_request:
  push:
    branches:
      - preprod
      - main

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend
        run: docker build --target build -t rekr-backend:ci ./backend
