# Never combine with compose.prod.yml.
# docker compose -f compose.yml -f compose.data.yml --profile data up -d
services:
  backend:
    environment:
      SWIPE_EVENTS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./data:/app/data:ro

  frontend:
    environment:
      VITE_DATA_ANALYTICS_ENABLED: "true"

  kafka:
    extends:
      file: ./docker/docker-compose.yml
      service: kafka
    profiles: [data]
    ports: !override
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_ROLL_MS: 3600000
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 268435456
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    mem_limit: 1g

  kafka-ui:
    extends:
      file: ./docker/docker-compose.yml
      service: kafka-ui
    profiles: [data]
    ports: !override
      - "127.0.0.1:8085:8080"
    environment:
      JAVA_OPTS: -Xms128m -Xmx384m
    mem_limit: 512m

  kafka-init:
    image: apache/kafka:4.0.0
    profiles: [data]
    entrypoint: [/opt/kafka/bin/kafka-topics.sh]
    command:
      [
        --bootstrap-server,
        "kafka:9092",
        --create,
        --if-not-exists,
        --topic,
        rekr.swipe-events,
        --partitions,
        "3",
        --replication-factor,
        "1",
      ]
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

  namenode:
    image: apache/hadoop:3.4.1
    profiles: [data]
    hostname: namenode
    user: root
    entrypoint: [/bin/bash, -c]
    command:
      - "mkdir -p /data/name; if [ ! -f /data/name/current/VERSION ]; then hdfs namenode -format -nonInteractive; fi; exec hdfs namenode"
    environment:
      HADOOP_HEAPSIZE_MAX: 512
    volumes:
      - hdfs_name:/data/name
      - ./data/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./data/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    ports:
      - "127.0.0.1:9870:9870"
    healthcheck:
      test: [CMD-SHELL, "hdfs dfs -ls / >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
    mem_limit: 1g

  datanode:
    image: apache/hadoop:3.4.1
    profiles: [data]
    hostname: datanode
    user: root
    entrypoint: [/bin/bash, -c]
    command: ["mkdir -p /data/blocks; exec hdfs datanode"]
    environment:
      HADOOP_HEAPSIZE_MAX: 512
    volumes:
      - hdfs_blocks:/data/blocks
      - ./data/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./data/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'hdfs dfsadmin -report | grep -q "Live datanodes (1)"']
      interval: 15s
      timeout: 10s
      retries: 20
    mem_limit: 1g

  events-sink:
    profiles: [data]
    build:
      context: ./backend
      target: dev
    command: node /app/data/sink.cjs
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WEBHDFS_URL: http://namenode:9870
    volumes:
      - ./data:/app/data:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      datanode:
        condition: service_healthy
    restart: on-failure
    mem_limit: 256m

  spark:
    build:
      context: ./data
      dockerfile: Dockerfile.spark
    profiles: [data-jobs]
    environment:
      HADOOP_USER_NAME: root
    volumes:
      - ./data:/opt/rekr:ro
    entrypoint: [/opt/spark/bin/spark-submit]
    command:
      [
        --master,
        "local[2]",
        --driver-memory,
        1g,
        /opt/rekr/analyze.py,
        --source,
        synthetic,
      ]
    depends_on:
      datanode:
        condition: service_healthy
    mem_limit: 2g

volumes:
  kafka-data:
  hdfs_name:
  hdfs_blocks:
