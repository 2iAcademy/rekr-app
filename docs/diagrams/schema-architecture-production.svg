  <rect x="310" y="280" width="260" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="306" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Backend &#183; API NestJS</text>
  <text x="440" y="325" text-anchor="middle" font-size="12" fill="#52606d">:3001 &#183; préfixe /api</text>
  <text x="440" y="342" text-anchor="middle" font-size="11.5" fill="#52606d">réseau Docker interne seulement</text>
  <rect x="60" y="280" width="190" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="155" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">migrate</text>
  <text x="155" y="323" text-anchor="middle" font-size="11.5" fill="#52606d">prisma migrate deploy</text>
  <line x1="155" y1="340" x2="155" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="163" y="390" font-size="11" fill="#52606d">migrations</text>
  <rect x="60" y="430" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="155" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">PostgreSQL 18</text>
  <text x="155" y="475" text-anchor="middle" font-size="11.5" fill="#52606d">source de vérité</text>
  <rect x="290" y="430" width="190" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="385" y="455" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Elasticsearch 9.5</text>
  <text x="385" y="475" text-anchor="middle" font-size="11.5" fill="#52606d">nœud unique &#183; clé API</text>
  <rect x="500" y="430" width="130" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="565" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Volume</text>
  <text x="565" y="475" text-anchor="middle" font-size="11.5" fill="#52606d">backend_uploads</text>
  <line x1="360" y1="352" x2="210" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="238" y="372" font-size="11" fill="#52606d">Prisma</text>
  <line x1="420" y1="352" x2="385" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="408" y="395" font-size="11" fill="#52606d">fil candidat</text>
  <line x1="500" y1="352" x2="565" y2="430" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="385" font-size="11" fill="#52606d">fichiers</text>
  <rect x="720" y="150" width="230" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
