      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-front" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="330" y="20" width="220" height="52" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="440" y="43" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Navigateur</text>
  <text x="440" y="61" text-anchor="middle" font-size="12" fill="#52606d">Candidat, recruteur</text>
  <rect x="30" y="110" width="620" height="420" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="50" y="132" font-size="12.5" font-weight="bold" fill="#64748b">VPS Hetzner &#183; compose.prod.yml</text>
  <line x1="440" y1="72" x2="440" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="96" text-anchor="end" font-size="11" fill="#52606d">HTTPS 443</text>
  <rect x="310" y="150" width="260" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
