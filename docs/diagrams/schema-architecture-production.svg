  <text x="835" y="193" text-anchor="middle" font-size="11.5" fill="#52606d">région EU &#183; messages</text>
  <rect x="720" y="250" width="230" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="835" y="274" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Sentry</text>
  <text x="835" y="293" text-anchor="middle" font-size="11.5" fill="#52606d">erreurs front + back</text>
  <rect x="720" y="350" width="230" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="835" y="374" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">Relais SMTP (Brevo)</text>
  <text x="835" y="393" text-anchor="middle" font-size="11.5" fill="#52606d">port 587</text>
  <rect x="720" y="450" width="230" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="835" y="474" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2933">API Adresse</text>
  <text x="835" y="493" text-anchor="middle" font-size="11.5" fill="#52606d">api-adresse.data.gouv.fr</text>
  <line x1="570" y1="292" x2="720" y2="185" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="178" text-anchor="end" font-size="11" fill="#52606d">jeton, canal</text>
  <line x1="570" y1="305" x2="720" y2="282" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="276" text-anchor="end" font-size="11" fill="#52606d">erreurs</text>
  <line x1="570" y1="325" x2="720" y2="378" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="396" text-anchor="end" font-size="11" fill="#52606d">e-mails</text>
  <line x1="570" y1="345" x2="720" y2="475" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="712" y="494" text-anchor="end" font-size="11" fill="#52606d">communes</text>
  <path d="M550,46 H965 V180 H952" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-front)"/>
  <path d="M965,180 V280 H952" fill="none" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow-front)"/>
  <text x="760" y="38" text-anchor="middle" font-size="11" fill="#2563eb">depuis le navigateur : messages (jeton de l'API), erreurs du front</text>
  <text x="490" y="562" text-anchor="middle" font-size="11.5" fill="#52606d" font-style="italic">Seul Caddy publie des ports ; le reste ne communique que sur le réseau Docker interne.</text>
