  <text x="470" y="222" text-anchor="middle" font-size="11" fill="#52606d">scrape /api/metrics &#183; 30 s</text>
  <text x="490" y="550" text-anchor="middle" font-size="11.5" fill="#52606d" font-style="italic">Sentry, Stream et SMTP sont facultatifs : sans clé, Sentry est inerte, la messagerie répond 503 et les e-mails vont dans les logs.</text>
