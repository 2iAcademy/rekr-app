services:
  backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
        target: dev
      command: npm run start:dev
      environment:
        NODE_ENV: development
        PORT: ${PORT:-3001}
        DATABASE_URL: ${DATABASE_URL:-}
        SENTRY_DSN: ${SENTRY_DSN:-}
        JWT_SECRET: ${JWT_SECRET:-}
      volumes:
        - ./backend:/app
        - /app/node_modules
      ports:
        - "${PORT:-3001}:3001"
      depends_on:
        postgres:
          condition: service_healthy

  frontend:
    build:
      context: ./clientApp
      dockerfile: Dockerfile
      target: dev
    environment:
      VITE_API_TARGET: ${VITE_API_TARGET:-http://backend:3001}
      VITE_API_URL: ${VITE_API_URL:-/api}
    volumes:
      - ./clientApp:/app
      - /app/node_modules
    ports:
      - "8080:8080"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-backend}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg18_data:
